<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <script>
        function registerUser(event) {
            event.preventDefault();

            let username = document.getElementById("username").value;
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;
            let confirmPassword = document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                alert("Passwords do not match!");
                return;
            }

            let user = {
                username: username,
                email: email,
                password: password
            };

            localStorage.setItem(email, JSON.stringify(user));
            alert("Registration Successful! You can now log in.");

            window.location.href = "SigninPg.html";
        }
    </script>
</head>
<body style="text-align: center;">
    <h2>Sign Up</h2>
    <form onsubmit="registerUser(event)" style="margin: 20px auto; display: inline-block; border: 1px solid black; padding: 20px;">
        <table>
            <tr>
                <td>Username:</td>
                <td><input type="text" id="username" required></td>
            </tr>
            <tr>
                <td>Email:</td>
                <td><input type="email" id="email" required></td>
            </tr>
            <tr>
                <td>Password:</td>
                <td><input type="password" id="password" required></td>
            </tr>
            <tr>
                <td>Confirm Password:</td>
                <td><input type="password" id="confirmPassword" required></td>
            </tr>
            <tr>
                <td colspan="2">
                    <input type="checkbox" required> I agree to the terms and conditions
                </td>
            </tr>
            <tr>
                <td colspan="2" style="text-align: center;">
                    <button type="submit">Sign Up</button>
                </td>
            </tr>
        </table>
        <p>Already have an account? <a href="SigninPg.html">Sign In</a></p>
    </form>
</body>
</html>
